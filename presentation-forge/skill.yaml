name: presentation-forge
version: 1.0.0
description: |
  AI-powered presentation creation, validation, and refinement workflow.
  Generates Slidev markdown presentations with automated overflow detection,
  accessibility checking, and iterative refinement based on feedback.

author: Brian Lopez
license: MIT

# Skill triggers - when Claude should invoke this skill
triggers:
  - create presentation
  - build slides
  - presentation forge
  - slidev presentation
  - stakeholder briefing
  - technical presentation

# 5-Phase Workflow (validated via dual-AI strategic planning)
workflow:
  phases:
    - name: STRUCTURE
      description: Generate YAML outline for stakeholder approval before full generation
      file: workflows/structure.md
    - name: GENERATE
      description: Create Slidev markdown from approved outline
      file: workflows/generate.md
    - name: VALIDATE
      description: Automated checks (overflow, accessibility, timing)
      file: workflows/validate.md
    - name: REFINE
      description: AI proposes fixes, user confirms (AI-Assistant model)
      file: workflows/refine.md
    - name: FINALIZE
      description: Export artifacts, create leave-behinds, package deliverables
      file: workflows/finalize.md

# Available templates
templates:
  - name: base
    file: templates/_base.md
    description: Minimal Slidev structure with branding hooks
  - name: stakeholder-briefing
    file: templates/stakeholder-briefing.md
    description: Executive presentation with approval checkpoints
  - name: technical-deep-dive
    file: templates/technical-deep-dive.md
    description: Technical audience with code blocks and diagrams

# Validators run during VALIDATE phase
validators:
  - name: overflow-check
    file: validators/overflow-check.js
    description: Playwright-based DOM overflow detection
  - name: slide-crawler
    file: validators/slide-crawler.js
    description: Systematic slide-by-slide analysis
  - name: accessibility-check
    file: validators/accessibility-check.js
    description: WCAG contrast and aria validation

# Dependencies (version-locked per Gemini recommendation)
dependencies:
  runtime:
    - "@slidev/cli@^0.49.0"
    - "playwright@^1.40.0"
  optional:
    - "mermaid@^10.0.0"
    - "@slidev/theme-default@latest"

# Configuration options
config:
  defaultTemplate: stakeholder-briefing
  defaultTheme: default
  slidevPort: 3030
  validationTimeout: 30000
  maxSlidesPerDeck: 30

# Entry points for Claude Code
commands:
  - name: forge
    description: Start the full 5-phase workflow
    entrypoint: instructions.md
  - name: forge:structure
    description: Generate outline only
    entrypoint: workflows/structure.md
  - name: forge:validate
    description: Validate existing presentation
    entrypoint: workflows/validate.md
  - name: forge:refine
    description: Refine based on feedback
    entrypoint: workflows/refine.md
